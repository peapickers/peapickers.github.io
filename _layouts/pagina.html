<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page.title }} · peapickers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --papier: #F7F7F6; --inkt: #111111; --zacht: #444444;
      --letter: "Courier Prime", "Courier New", Courier, monospace; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--papier); color: var(--inkt); font-family: var(--letter); line-height: 1.5; }
    main { max-width: 680px; margin: 0 auto; padding: 40px 16px; }
    nav { font-size: .9rem; margin-bottom: 1.5rem; }
    a { color: var(--inkt); }
    h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); letter-spacing: .04em; margin: 0 0 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--inkt); }
    h2 { font-size: 1.25rem; margin: 2.2rem 0 .8rem; padding: 6px 10px; border: 1px solid var(--inkt); }
    h3 { font-size: 1rem; margin: 1.4rem 0 .4rem; }
    blockquote { margin: 1rem 0; padding: 10px 14px; border: 1px dashed var(--inkt); }
    blockquote p { margin: 0; }
    code, pre { font-family: var(--letter); }
    pre { white-space: pre-wrap; border: 1px solid var(--inkt); padding: 12px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { border: 1px solid var(--inkt); padding: 4px 8px; text-align: left; vertical-align: top; }
    footer { font-size: .85rem; color: var(--zacht); margin-top: 3rem; border-top: 1px solid var(--inkt); padding-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <nav><a href="/">peapickers</a> · <a href="https://peapickers.github.io/peapickersarchief/ledger.html">Public Ledger</a></nav>
    {{ content }}
    <footer>peapickers · Gent · In preview: teksten zijn nog in opbouw.</footer>
  </main>
</body>
</html>
